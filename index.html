<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インフルエンザ・感染症 トレンド予測モニター</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .card { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px; }
        img { max-width: 100%; height: auto; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>インフルエンザ・感染症 トレンド予測モニター</h1>
    <p>過去のデータ推移、現状の分析、および今後の展望予測を自動収集して表示するページです。</p>
    
    <div class="card">
        <h2>📊 トレンド推移・予測グラフ</h2>
        <!-- プログラムが自動生成するグラフ画像を表示 (キャッシュ回避用の ?v=2 を追加) -->
        <img src="output/trend_chart.png?v=2" alt="Trend Chart" onerror="this.style.display='none'; document.getElementById('no-image').style.display='block';">
        <p id="no-image" style="color: #666; display:none;">（※まだグラフ画像が生成されていません。プログラムの初回実行をお待ちください。）</p>
    </div>
</body>
</html>
