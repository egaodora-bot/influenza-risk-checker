name: run-checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # 毎日朝8時に自動実行

jobs:
  run-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # リポジトリへ自動保存するために必須の権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: |
          python main.py

      - name: Commit and push if data or chart changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/trend_chart.png data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update trend chart and history" && git push)
